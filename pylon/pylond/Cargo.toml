[package]
authors = ["The Cloud Hypervisor Authors"]
default-run = "pylond"
edition.workspace = true
name = "pylond"
rust-version.workspace = true
version = "0.1.0"

[[bin]]
name = "pylond"
path = "src/main.rs"

[[bin]]
name = "pylon-bench"
path = "src/bin/pylon_bench.rs"

[dependencies]
anyhow = { workspace = true }
arc-swap = "1.7"
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
memmap2 = "0.9"
pylon-abi = { path = "../pylon-abi" }
scx-pylon = { path = "../scx-pylon" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[lints]
workspace = true
