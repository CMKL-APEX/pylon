name: Pylon Release
on: [create, merge_group]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || github.event_name == 'merge_group'
    name: Release ${{ matrix.platform.target }}
    # The VMM and ch-remote for every target, and the guest agent as a static binary. pylond
    # and scx-pylon need the target's libelf, so the `pylon-host` job builds them natively.
    strategy:
      fail-fast: false
      matrix:
        platform:
        - target: x86_64-unknown-linux-gnu
          args: --release -p cloud-hypervisor --features cloud-hypervisor/mshv
          name_ch: cloud-hypervisor
          name_ch_remote: ch-remote
        - target: x86_64-unknown-linux-musl
          args: --release -p cloud-hypervisor -p pylon-guest-agent --features cloud-hypervisor/mshv
          name_ch: cloud-hypervisor-static
          name_ch_remote: ch-remote-static
          name_agent: pylon-guest-agent-static
        - target: aarch64-unknown-linux-musl
          args: --release -p cloud-hypervisor -p pylon-guest-agent
          name_ch: cloud-hypervisor-static-aarch64
          name_ch_remote: ch-remote-static-aarch64
          name_agent: pylon-guest-agent-static-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl-gcc
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt install -y musl-tools
      - name: Create release directory
        if: |
          github.event_name == 'create' && github.event.ref_type == 'tag' &&
          matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: rsync -rv --exclude=.git . ../pylon-${{ github.event.ref }}
      - name: Build ${{ matrix.platform.target }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.args  }}
          strip: true
          toolchain: "1.89.0"
      - name: Copy Release Binaries
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/cloud-hypervisor dist/${{ matrix.platform.name_ch }}
          cp target/${{ matrix.platform.target }}/release/ch-remote dist/${{ matrix.platform.name_ch_remote }}
          if [ -n "${{ matrix.platform.name_agent }}" ]; then
            cp target/${{ matrix.platform.target }}/release/pylon-guest-agent dist/${{ matrix.platform.name_agent }}
          fi
      - name: Upload Release Artifacts
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Artifacts for ${{ matrix.platform.target }}
          path: dist/
      - name: Vendor
        if: |
          github.event_name == 'create' && github.event.ref_type == 'tag' &&
          matrix.platform.target == 'x86_64-unknown-linux-gnu'
        working-directory: ../pylon-${{ github.event.ref }}
        run: |
          mkdir ../vendor-cargo-home
          export CARGO_HOME=$(realpath ../vendor-cargo-home)
          mkdir .cargo
          cargo vendor > .cargo/config.toml
      - name: Create vendored source archive
        if: |
          github.event_name == 'create' && github.event.ref_type == 'tag' &&
          matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: tar cJf dist/pylon-${{ github.event.ref }}.tar.xz ../pylon-${{ github.event.ref }}
      - name: Upload vendored source archive
        if: |
          github.event_name == 'create' && github.event.ref_type == 'tag' &&
          matrix.platform.target == 'x86_64-unknown-linux-gnu'
        id: upload-release-vendored-sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/pylon-${{ github.event.ref }}.tar.xz
          name: pylon-${{ github.event.ref }}.tar.xz
      - name: Create GitHub Release
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*

  # pylond and scx_pylon, built natively because libbpf links the target's libelf. They link
  # glibc, libelf, zlib and zstd dynamically, so they are built on Ubuntu 24.04 to run on hosts
  # with glibc 2.39 or later. The x86_64 job also ships the pv-pylon guest module's source.
  pylon-host:
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || github.event_name == 'merge_group'
    name: Release Pylon host tools ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
          suffix: ""
        - arch: aarch64
          runner: ubuntu-24.04-arm
          suffix: -aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq build-essential clang llvm libelf-dev zlib1g-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Build pylond and scx_pylon
        run: cargo build --locked --release -p pylond -p scx-pylon
      - name: Copy Release Binaries
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        run: |
          mkdir -p dist
          strip -o dist/pylond${{ matrix.suffix }} target/release/pylond
          strip -o dist/scx_pylon${{ matrix.suffix }} target/release/scx_pylon
      - name: Create pv-pylon source archive
        if: |
          github.event_name == 'create' && github.event.ref_type == 'tag' &&
          matrix.arch == 'x86_64'
        run: tar czf dist/pv-pylon-${{ github.event.ref }}.tar.gz -C pylon/guest linux
      - name: Upload Release Artifacts
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pylon host tools for ${{ matrix.arch }}
          path: dist/
      - name: Create GitHub Release
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*

  pylon-assets:
    if: github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    name: Pylon release assets (x86_64)
    # The hosts run Ubuntu 24.04; a newer runner's glibc would not load there.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install BPF & VMM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq \
            build-essential \
            clang \
            llvm \
            libelf-dev \
            zlib1g-dev \
            libssl-dev \
            pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Build pylon and pylond
        run: cargo build --release --locked --bin cloud-hypervisor --bin pylond
      - name: Collect assets
        run: |
          mkdir assets
          strip -o assets/pylon-x86_64 target/release/cloud-hypervisor
          strip -o assets/pylond-x86_64 target/release/pylond
          cd assets && sha256sum pylon-x86_64 pylond-x86_64 > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            ./assets/pylon-x86_64
            ./assets/pylond-x86_64
            ./assets/SHA256SUMS
